# pgdocket quickstart: Postgres + the pgdocket worker. See README.md in this folder.
name: pgdocket-quickstart

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: quickstart
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      retries: 30

  pgdocket:
    build: ../..
    image: pgdocket:quickstart
    environment:
      DATABASE_URL: postgresql://postgres:quickstart@db:5432/shop
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
