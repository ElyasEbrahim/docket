name: Release

# Runs only when a version tag is pushed, e.g. `git tag v0.1.0a1 && git push origin v0.1.0a1`.
# See docs/RELEASING.md for the one-time PyPI setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Tag must match pgdocket.__version__
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('pgdocket/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: pip install build==1.2.2 && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi                      # trusted publishing: no token stored in the repository
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/elyasebrahim/pgdocket:${{ needs.build.outputs.version }}

  github-release:
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*) flags="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* $flags --title "pgdocket ${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/ElyasEbrahim/pgdocket/blob/master/CHANGELOG.md). Install: \`pip install pgdocket==${{ needs.build.outputs.version }}\` or \`docker pull ghcr.io/elyasebrahim/pgdocket:${{ needs.build.outputs.version }}\`."
